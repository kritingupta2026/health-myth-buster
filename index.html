function dist(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function fixWord(w){if(typo[w])return typo[w];if(w.length<5)return w;let best=w,n=99;for(const v of vocab){let x=dist(w,v);if(x<n){n=x;best=v}}return n<=2?best:w}
const clean=s=>{let x=s.toLowerCase().replace(/[’']/g,'');x=x.replace(/\bdont\b/g,'do not').replace(/\bdoesnt\b/g,'does not').replace(/\bcant\b/g,'cannot').replace(/\bwont\b/g,'will not').replace(/\bisnt\b/g,'is not').replace(/\barent\b/g,'are not');return x.replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim().split(' ').map(fixWord).join(' ')};
function tokens(x){return clean(x).split(' ').filter(Boolean)}
function edit(a,b){const d=Array.from({length:a.length+1},(_,i)=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)d[i][0]=i;for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function wordMatch(a,b){if(a===b)return true;if(a.length>=6&&b.length>=6&&a[0]===b[0]&&edit(a,b)<=2)return true;return false}
function phraseMatch(text,phrase){const T=tokens(text),P=tokens(phrase);return P.every(p=>T.some(t=>wordMatch(t,p)))}
function topicScore(text,f){return f[1].reduce((n,k)=>n+(phraseMatch(text,k)?1:0),0)}
function meaningScore(text,arr){return arr.reduce((n,k)=>n+(phraseMatch(text,k)?1:0),0)}
function hasNeg(t){return /\b(no|not|never|cannot|without)\b/.test(clean(t))}
function classifySpecial(t,f){const fact=f[0];const x=clean(t);
 if(fact.includes('vaccines do not cause autism')){if(!phraseMatch(x,'vaccine')||!phraseMatch(x,'autism'))return null;if(phraseMatch(x,'cause')||phraseMatch(x,'caused')||phraseMatch(x,'because'))return hasNeg(x)?'REAL':'FAKE';return null}
 if(fact.includes('antibiotics do not cure viral infections')){if(!phraseMatch(x,'antibiotic')||!phraseMatch(x,'virus'))return null;if(phraseMatch(x,'cure')||phraseMatch(x,'work'))return hasNeg(x)?'REAL':'FAKE';return null}
 if(fact.includes('hot water cannot cure cancer')){if(!phraseMatch(x,'hot water')||!phraseMatch(x,'cancer'))return null;const xt=tokens(x);if(xt.some(w=>['cause','causes','caused','causing'].includes(w)))return 'UNVERIFIED';if(xt.some(w=>['cure','cures','cured','curing'].includes(w)))return hasNeg(x)?'REAL':'FAKE';return null}
 return null}
let last='';function answer(){let raw=q.value.trim();if(!raw)return;let t=clean(raw),cands=F.map(f=>({f,s:topicScore(t,f)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);chat.innerHTML+=`<div class="msg user">${raw.replace(/[<>]/g,'')}</div>`;let type='UNVERIFIED',f=null,reason='This message is not clearly covered by my 50 facts.';if(cands.length){let top=cands[0];f=top.f;let special=classifySpecial(t,f);if(special==='UNVERIFIED'){type='UNVERIFIED';reason='My database talks about hot water curing cancer, not causing cancer.';f=null}else if(special){type=special;reason=f[4]}else{let needed=top.f[1].length>1?2:1;if(top.s>=needed){let y=meaningScore(t,f[2]),n=meaningScore(t,f[3]);if(y>n&&y>0){type='REAL';reason=f[4]}else if(n>y&&n>0){type='FAKE';reason=f[4]}else{f=null}}else{f=null}}}last=`${type}. Reason: ${reason} Always ask a doctor.`;let src=f?`<br><b>Trusted source:</b> ${f[5]}<br><a href="${f[6]}" target="_blank" rel="noopener">Check source</a>`:'';chat.innerHTML+=`<div class="msg bot"><b class="${type}">${type}</b><br><b>Reason:</b> ${reason}${src}<br><b>Always ask a doctor.</b></div>`;chat.scrollTop=chat.scrollHeight;q.value=''}

read.onclick=()=>{if(!last)return;readGeneration++;speechSynthesis.cancel();activeUtterance=new SpeechSynthesisUtterance(last);activeUtterance.rate=.92;activeUtterance.onstart=()=>note.textContent='Reading aloud...';activeUtterance.onend=()=>{activeUtterance=null;note.textContent='Finished reading.'};activeUtterance.onerror=e=>{activeUtterance=null;note.textContent='Read aloud error: '+e.error};setTimeout(()=>speechSynthesis.speak(activeUtterance),80)};
pause.onclick=()=>{if(speechSynthesis.speaking&&!speechSynthesis.paused){speechSynthesis.pause();note.textContent='Paused.'}};

stop.onclick=()=>{readGeneration++;if(speechSynthesis.paused)speechSynthesis.resume();speechSynthesis.cancel();activeUtterance=null;setTimeout(()=>speechSynthesis.cancel(),60);setTimeout(()=>speechSynthesis.cancel(),180);note.textContent='Stopped.'};
let voiceRec=null;mic.onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){note.textContent='Voice input is not supported in this browser. Please use Chrome or Edge.';return}if(voiceRec){try{voiceRec.stop()}catch(e){}voiceRec=null}voiceRec=new SR();voiceRec.lang='en-IN';voiceRec.continuous=false;voiceRec.interimResults=true;voiceRec.maxAlternatives=1;let heard='';voiceRec.onstart=()=>{note.textContent='Listening... Speak now.';mic.textContent='🎤 Listening...'};voiceRec.onaudiostart=()=>{note.textContent='Microphone is on. Speak now.'};voiceRec.onspeechstart=()=>{note.textContent='I can hear you...'};voiceRec.onresult=e=>{let text='';let finalText='';for(let i=e.resultIndex;i<e.results.length;i++){let part=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=part;else text+=part}heard=(finalText||text||heard).trim();if(heard){q.value=heard;note.textContent=finalText?'Voice captured: '+heard:'Hearing: '+heard}};voiceRec.onnomatch=()=>{note.textContent='I heard sound but could not understand the words. Please try again.'};voiceRec.onerror=e=>{note.textContent='Voice error: '+e.error;mic.textContent='🎤 Speak';voiceRec=null};voiceRec.onend=()=>{mic.textContent='🎤 Speak';if(heard){q.value=heard;note.textContent='Voice captured: '+heard}else{note.textContent='No words were captured. Press Speak and try again.'}voiceRec=null};try{voiceRec.start()}catch(e){note.textContent='Voice could not start: '+e.name;mic.textContent='🎤 Speak';voiceRec=null}};
